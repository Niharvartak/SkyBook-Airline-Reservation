services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-skybook}
      MYSQL_USER: ${MYSQL_USER:-skybook_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
      # Seed schema + demo data on first start of an empty volume.
      # Runs only when the MariaDB data directory is empty.
      - ./database/skybook.sql:/docker-entrypoint-initdb.d/10-skybook.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 random characters)}
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-skybook}
      MYSQL_USER: ${MYSQL_USER:-skybook_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      SKYBOOK_CORS_ALLOWED_ORIGINS: ${SKYBOOK_CORS_ALLOWED_ORIGINS:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      FARE_WATCH_INTERVAL_MINUTES: ${FARE_WATCH_INTERVAL_MINUTES:-30}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SKYBOOK_ADMIN_EMAIL: ${SKYBOOK_ADMIN_EMAIL:-}
      SKYBOOK_ADMIN_PASSWORD: ${SKYBOOK_ADMIN_PASSWORD:-}
      SKYBOOK_ALLOW_DEMO_ACCOUNTS: ${SKYBOOK_ALLOW_DEMO_ACCOUNTS:-false}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8080/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SKYBOOK_HTTP_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  db_data:
