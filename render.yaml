# Render Blueprint for the existing SkyBook app.
#
# This deploys one Docker web service that serves the built React SPA and the
# Express API from the same origin. The MySQL database is external because
# Render's free tier has no persistent disks and its free managed database is
# PostgreSQL-only. Use an always-free Aiven MySQL service (or another managed
# MySQL provider) and enter its connection values in the Render dashboard.
#
# Render free web services sleep after inactivity. Aiven free MySQL services
# can also be powered off after inactivity; power them back on in the Aiven
# console when needed. Neither is a paid, always-on production SLA.
services:
  - type: web
    name: skybook
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: HOST
        value: 0.0.0.0
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL
        value: "true"
      - key: MYSQL_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: MYSQL_SSL_CA_BASE64
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SKYBOOK_ADMIN_EMAIL
        sync: false
      - key: SKYBOOK_ADMIN_PASSWORD
        sync: false
      - key: SKYBOOK_DEMO_PASSWORD
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: SKYBOOK_CORS_ALLOWED_ORIGINS
        value: ""
      - key: FARE_WATCH_INTERVAL_MINUTES
        value: "30"
      - key: TRUST_PROXY
        value: "1"
