spring.application.name=skybook
server.port=8080
skybook.cors.allowed-origins=${SKYBOOK_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Load existing local credentials when launched from backend-java or workspace root.
# Environment variables can override these values. Never commit passwords here.
spring.config.import=optional:file:../src/backend/.env[.properties],optional:file:src/backend/.env[.properties]
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Existing XAMPP server is MariaDB 10.4, accessed using MySQL Connector/J.
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
# Preserve all existing tables, columns and records; no automatic DDL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl